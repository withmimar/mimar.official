.wrap{max-width:1080px;margin:auto;padding:0 20px}
section{padding:72px 0}section.alt{background:var(--alt)}
.eyebrow{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:.75rem;font-weight:500}
.sec-h{text-align:center;max-width:600px;margin:0 auto 40px}.sec-h h2{font-size:2rem}.sec-h p{color:var(--mut);margin:0}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-size:.88rem}
nav a{color:var(--tx);text-decoration:none}nav ul a:hover{color:var(--gold)}
.btn{display:inline-block;background:var(--sage2);color:#fff;padding:12px 26px;border-radius:99px;text-decoration:none;font-weight:500;font-size:.92rem;border:0;cursor:pointer}
:root[data-theme="dark"] .btn{color:#1d1a18}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#1d1a18}}
.btn.ghost{background:none;color:var(--sage2);border:1.5px solid var(--sage2)}:root[data-theme="dark"] .btn.ghost{color:var(--sage2);background:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--sage2);background:none}}
.hero{padding:80px 0 64px;background:radial-gradient(circle at 80% 20%,color-mix(in srgb,var(--rose) 35%,transparent),transparent 55%),radial-gradient(circle at 10% 90%,color-mix(in srgb,var(--sage) 30%,transparent),transparent 50%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.3rem)}.hero p{color:var(--mut);max-width:480px}.hero .btn{margin:8px 10px 0 0}
.art{aspect-ratio:4/5;border-radius:200px 200px 24px 24px;background:linear-gradient(160deg,var(--sage),var(--rose));display:grid;place-items:center;color:#fff;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sw{aspect-ratio:1/1;display:grid;place-items:end start;padding:12px;position:relative;overflow:hidden}.sw svg,.sw img{position:absolute;inset:0;width:100%;height:100%}.sw img{object-fit:cover}.sw span{position:relative;z-index:1}.old{color:var(--mut);font-weight:400;font-size:.82rem;margin-left:6px;text-decoration:line-through}
.sw span{background:rgba(255,255,255,.85);color:#3b2f2a;font-size:.72rem;padding:3px 10px;border-radius:99px}
.card .b{padding:16px 18px 20px}.card h3{font-size:1.1rem;margin:0}.card p{color:var(--mut);font-size:.85rem;margin:4px 0 10px}
.price{color:var(--gold);font-weight:600;margin-bottom:12px}
.card .btn{padding:9px 20px;font-size:.84rem}
.soon{opacity:.75}.soon .sw{background:repeating-linear-gradient(45deg,var(--alt),var(--alt) 10px,var(--line) 10px,var(--line) 20px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.vals div{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.85rem;text-align:center}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px}
.step{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:24px 16px 18px;text-align:center;position:relative}
.step:before{counter-increment:s;content:counter(s);position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:600}
.step h3{font-size:1rem}.step p{font-size:.82rem;color:var(--mut);margin:0}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.pay .card{padding:20px}.pay h3{font-size:1.05rem}.pay p{margin:2px 0;font-size:.88rem;color:var(--mut)}.pay b{color:var(--tx)}
.note{text-align:center;color:var(--mut);font-size:.85rem;margin-top:22px}
.rev{padding:22px}.rev q{display:block;font-style:italic;margin-bottom:12px}.rev small{color:var(--gold)}
footer{background:#7d4663;color:#fff;padding:44px 0 30px;text-align:center}
footer p{opacity:.85;font-size:.88rem;margin:8px 0}
#bar{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:8px}
#bar button{border:0;border-radius:99px;padding:11px 18px;background:var(--gold);color:#fff;font:500 .85rem Poppins,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#bar #rs{display:none;background:#8a5a54}
body.edit #rs{display:block}
body.edit [data-e]{outline:1.5px dashed var(--gold);outline-offset:2px;cursor:text}
@media(max-width:760px){nav ul{display:none}.hero .wrap,.two{grid-template-columns:1fr}.art{max-width:300px;margin:auto}.vals{grid-template-columns:1fr}section{padding:54px 0}}
</style>

  {q:"Pengiriman cepat, packing rapi kayak hadiah. Recommended.",n:"Nadia, Jakarta"},
  {q:"Warna dusty rose-nya persis seperti foto. Suka!",n:"Fitri, Surabaya"}
 ],

/* ======================================================================== */
let S={};try{S=JSON.parse(localStorage.getItem('mimar-edit')||'{}')}catch(e){}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const E=(id,t,tag='span',cls='')=>`<${tag} class="${cls}" data-e="${id}">${esc(S[id]??t)}</${tag}>`;
const wa=m=>`https://wa.me/${C.wa}?text=${encodeURIComponent(m)}`;
const hj=c=>`<svg viewBox="0 0 200 200" aria-hidden="true"><path d="M18 200Q28 140 100 134Q172 140 182 200Z" fill="${c}" stroke="rgba(0,0,0,.14)"/><path d="M100 20C54 20 38 70 40 112C42 142 28 162 20 200H180C172 162 158 142 160 112C162 70 146 20 100 20Z" fill="${c}" stroke="rgba(0,0,0,.14)"/><ellipse cx="100" cy="90" rx="30" ry="38" fill="#f1d2bb"/><path d="M100 28C60 28 54 70 70 90C72 62 84 46 100 46C116 46 128 62 130 90C146 70 140 28 100 28Z" fill="${c}" stroke="rgba(0,0,0,.14)"/><path d="M62 152Q100 178 138 152M70 170Q100 188 130 170" stroke="rgba(0,0,0,.16)" fill="none" stroke-width="3" stroke-linecap="round"/></svg>`;
const P=C.products.map((p,i)=>`<div class="card ${p.soon?'soon':''}"><div class="sw" style="${p.color?'background:color-mix(in srgb,'+p.color+' 22%,var(--alt))':''}">${p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:p.color?hj(p.color):''}${p.tag?`<span>${esc(p.tag)}</span>`:''}</div><div class="b">${E('p'+i+'n',p.name,'h3')}${E('p'+i+'d',p.desc,'p')}<div class="price">${E('p'+i+'p',p.price)}${p.old?E('p'+i+'o',p.old,'s','old'):''}</div>${p.soon?'':`<a class="btn" href="${wa('Halo Mimar, saya mau pesan '+p.name)}" target="_blank" rel="noopener">Pesan</a>`}</div></div>`).join('');
document.getElementById('app').innerHTML=`
<section class="hero" id="home"><div class="wrap"><div>${E('he',C.hero.eyebrow,'div','eyebrow')}${E('ht',C.hero.title,'h1')}${E('hx',C.hero.text,'p')}<a class="btn" href="#produk">${E('hc1',C.hero.cta1)}</a><a class="btn ghost" href="${wa('Halo Mimar, saya mau tanya produk')}" target="_blank" rel="noopener">${E('hc2',C.hero.cta2)}</a></div><div class="art"><span class="lg" style="width:62%;color:#fff"></span></div></div></section>
<section id="produk"><div class="wrap"><div class="sec-h"><div class="eyebrow">Katalog</div>${E('s1','Koleksi Pashmina Viscose','h2')}${E('s1p','Pilih warna yang paling kamu suka.','p')}</div><div class="grid">${P}</div></div></section>
<section class="alt" id="tentang"><div class="wrap two"><div class="art" style="aspect-ratio:1/1;border-radius:24px;background:linear-gradient(140deg,var(--sage),var(--rose))"><span class="lg" style="width:55%;color:#fff"></span></div><div><div class="eyebrow">Cerita kami</div>${E('at',C.about.title,'h2')}${E('ax',C.about.text,'p')}<div class="vals">${C.about.vals.map((v,i)=>E('v'+i,v,'div')).join('')}</div></div></div></section>
<section id="alur"><div class="wrap"><div class="sec-h"><div class="eyebrow">Alur belanja</div>${E('s2','Dari pilih sampai ulasan','h2')}${E('s2p','Mudah, jelas, dan aman. Ini langkah-langkahnya.','p')}</div><div class="steps">${C.steps.map((s,i)=>`<div class="step">${E('st'+i,s.t,'h3')}${E('sd'+i,s.d,'p')}</div>`).join('')}</div></div></section>
<section class="alt" id="bayar"><div class="wrap"><div class="sec-h"><div class="eyebrow">Pembayaran</div>${E('s3','Metode pembayaran','h2')}${E('s3p','Pilih yang paling nyaman untukmu.','p')}</div><div class="pay">${C.pay.map((m,i)=>`<div class="card">${E('mt'+i,m.t,'h3')}${m.l.map((x,j)=>E('ml'+i+j,x,'p')).join('')}</div>`).join('')}</div>${E('pn',C.payNote,'p','note')}</div></section>
<section id="ulasan"><div class="wrap"><div class="sec-h"><div class="eyebrow">Ulasan</div>${E('s4','Kata mereka tentang Mimar','h2')}</div><div class="grid">${C.reviews.map((r,i)=>`<div class="card rev">★★★★★${E('rq'+i,r.q,'q')}${E('rn'+i,r.n,'small')}</div>`).join('')}</div></div></section>
<footer><div class="wrap"><div class="lg" style="width:130px;color:#fff;margin:0 auto"></div>${E('ft',C.footer,'p')}<p>Instagram ${esc(C.instagram)} · <a style="color:#fff" href="${C.shopee}" target="_blank" rel="noopener">Shopee</a> · <a style="color:#fff" href="${wa('Halo Mimar')}" target="_blank" rel="noopener">WhatsApp</a></p></div></footer>`;
document.getElementById('wa-top').href=wa('Halo Mimar, saya mau pesan');document.getElementById('wa-top').target='_blank';
const ed=document.getElementById('ed');
ed.onclick=()=>{const on=document.body.classList.toggle('edit');document.querySelectorAll('[data-e]').forEach(x=>x.contentEditable=on);ed.textContent=on?'✓ Selesai':'✎ Edit teks'};
document.addEventListener('input',e=>{const t=e.target.closest('[data-e]');if(t){S[t.dataset.e]=t.innerText;try{localStorage.setItem('mimar-edit',JSON.stringify(S))}catch(_){}}});
document.addEventListener('click',e=>{if(document.body.classList.contains('edit')&&e.target.closest('a'))e.preventDefault()});
const bar=document.getElementById('bar'),chk=()=>bar.style.display=location.hash==='#edit'?'flex':'none';chk();addEventListener('hashchange',chk);
document.getElementById('rs').onclick=()=>{try{localStorage.removeItem('mimar-edit')}catch(_){}location.reload()};
</script>
</body>
</html>
